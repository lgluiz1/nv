<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>QuickTrack - Motorista</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 16px;
            border: none;
        }
        .input-group-text {
            background-color: #f8f9fa;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Ocultar elementos auxiliares por padrão */
        .d-none {
            display: none !important;
        }
    </style>
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    
    <!-- TELA 1: LOADING -->
    <div id="screen-loading" class="text-center w-100">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-muted fw-bold" id="loading-text">Iniciando aplicativo...</p>
    </div>

    <!-- TELA 2: CÓDIGO DA EMPRESA -->
    <div id="screen-setup" class="card shadow w-100 d-none" style="max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="logo.png" alt="QuickTrack" class="logo-img">
                <h5 class="mt-3 fw-bold text-dark">Bem-vindo</h5>
                <p class="text-muted small">Vincule o aplicativo à sua transportadora</p>
            </div>

            <div id="setup-alert" class="alert d-none py-2 small" role="alert"></div>

            <form id="setup-form" onsubmit="salvarEmpresa(event)">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Código da Empresa</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-building text-muted"></i></span>
                        <input type="text" id="company-code" class="form-control" placeholder="Ex: transportex" autocomplete="off" style="text-transform: lowercase;" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" id="setup-btn">
                    Vincular <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- TELA 3: LOGIN DO MOTORISTA -->
    <div id="screen-login" class="card shadow w-100 d-none" style="max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="logo.png" alt="QuickTrack" class="logo-img mb-3" style="width: 80px; height: 80px;">
                <h5 class="fw-bold text-dark">Acesso do Motorista</h5>
                <p class="text-primary small fw-bold" id="current-company-text"></p>
            </div>

            <div id="login-alert" class="alert d-none py-2 small" role="alert"></div>

            <form id="login-form" onsubmit="realizarLogin(event)">
                <!-- CPF -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">CPF</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                        <input type="tel" id="login-cpf" class="form-control" placeholder="000.000.000-00" required maxlength="14" oninput="maskCPF(this)">
                    </div>
                </div>

                <!-- SENHA -->
                <div class="mb-3 d-none" id="area-senha">
                    <label class="form-label small fw-bold text-muted">Senha</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="login-senha" class="form-control" placeholder="Sua senha">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('login-senha')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- CONFIRMAR SENHA (Só para 1º acesso) -->
                <div class="mb-4 d-none" id="area-confirmar-senha">
                    <label class="form-label small fw-bold text-muted">Confirmar Senha</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="login-confirmar-senha" class="form-control" placeholder="Repita a senha">
                    </div>
                    <div class="form-text text-success small mt-1"><i class="bi bi-info-circle"></i> Este é seu primeiro acesso. Crie uma senha.</div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" id="login-btn">
                    Continuar
                </button>
                
                <!-- Botão de alterar empresa -->
                <div class="text-center mt-3">
                    <button type="button" class="btn btn-link text-muted small text-decoration-none" onclick="trocarEmpresa()">
                        Alterar Transportadora
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // =====================================================
    // CAPACITOR NATIVE PREFERENCES WRAPPER
    // =====================================================
    async function getPreference(key) {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
            try {
                const result = await window.Capacitor.Plugins.Preferences.get({ key });
                return result.value || null;
            } catch (e) {
                console.error('Erro ao ler Preference:', key, e);
            }
        }
        return localStorage.getItem(key); // Fallback para dev local no navegador
    }

    async function setPreference(key, value) {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
            try {
                await window.Capacitor.Plugins.Preferences.set({ key, value });
            } catch (e) {
                console.error('Erro ao salvar Preference:', key, e);
            }
        }
        localStorage.setItem(key, value);
    }
    
    async function removePreference(key) {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
            await window.Capacitor.Plugins.Preferences.remove({ key });
        }
        localStorage.removeItem(key);
    }

    // =====================================================
    // CONTROLE DE TELAS
    // =====================================================
    const screens = {
        loading: document.getElementById('screen-loading'),
        setup: document.getElementById('screen-setup'),
        login: document.getElementById('screen-login')
    };

    function showScreen(screenName) {
        Object.values(screens).forEach(el => el.classList.add('d-none'));
        screens[screenName].classList.remove('d-none');
    }

    function showMsg(elementId, msg, type) {
        const el = document.getElementById(elementId);
        el.className = `alert alert-${type} py-2 small fw-bold`;
        el.innerText = msg;
        el.classList.remove('d-none');
    }

    function setBtnLoading(btnId, isLoading, defaultText) {
        const btn = document.getElementById(btnId);
        btn.disabled = isLoading;
        if (isLoading) {
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Aguarde...`;
        } else {
            btn.innerHTML = defaultText;
        }
    }

    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================
    let globalServerUrl = '';
    let loginModo = 'CPF'; // 'CPF', 'LOGIN', 'PRIMEIRO_ACESSO'

    document.addEventListener('DOMContentLoaded', async () => {
        const serverUrl = await getPreference('server_url');
        const deviceToken = await getPreference('device_token');

        if (serverUrl) {
            globalServerUrl = serverUrl;
            
            // Se já tem server e token, tenta Biometria e faz Auto-Login
            if (deviceToken) {
                document.getElementById('loading-text').innerText = 'Verificando segurança...';
                
                let biometricsPassed = true;
                
                // Removido temporariamente: O plugin @capgo/capacitor-native-biometric 
                // causa Crash fatal (RuntimeException) em aparelhos da Xiaomi/Poco 
                // que usam Face Unlock 2D (Class 2 Weak Biometrics).
                /*
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativeBiometric) {
                    try {
                        const NativeBiometric = window.Capacitor.Plugins.NativeBiometric;
                        const result = await NativeBiometric.isAvailable();
                        if (result.isAvailable && result.strongBiometryIsAvailable) {
                            await NativeBiometric.verifyIdentity({
                                reason: "Para acessar o QuickTrack",
                                title: "Desbloquear",
                                subtitle: "Use sua digital ou face para entrar"
                            });
                        }
                    } catch (e) {
                        biometricsPassed = false;
                        console.error('Biometria falhou', e);
                    }
                }
                */
                
                if (biometricsPassed) {
                    document.getElementById('loading-text').innerText = 'Autenticando sessão...';
                    const redirectUrl = `${serverUrl}/api/auth/auto-login/?dt=${deviceToken}`;
                    loadAppIframe(redirectUrl);
                    return;
                } else {
                    // Falhou na biometria: força logar de novo
                    await removePreference('device_token');
                    prepararTelaLogin();
                    return;
                }
            }
            
            // Tem URL mas não tem token, exibe tela de login
            prepararTelaLogin();
        } else {
            // Não tem nada, exibe setup da empresa
            showScreen('setup');
        }
    });

    // =====================================================
    // EMPRESA SETUP
    // =====================================================
    async function salvarEmpresa(e) {
        e.preventDefault();
        const code = document.getElementById('company-code').value.trim().toLowerCase();
        const cleanCode = code.replace(/[^a-z0-9]/g, '');
        
        if (!cleanCode) {
            showMsg('setup-alert', 'Código inválido. Use apenas letras e números.', 'danger');
            return;
        }

        const finalUrl = `https://${cleanCode}.quicktrack.com.br`;
        await setPreference('server_url', finalUrl);
        globalServerUrl = finalUrl;
        
        prepararTelaLogin();
    }

    async function trocarEmpresa() {
        await removePreference('server_url');
        await removePreference('device_token');
        document.getElementById('company-code').value = '';
        showScreen('setup');
    }

    function prepararTelaLogin() {
        const domain = globalServerUrl.replace('https://', '').replace('.quicktrack.com.br', '').toUpperCase();
        document.getElementById('current-company-text').innerText = domain;
        
        // Reseta o form de login
        loginModo = 'CPF';
        document.getElementById('login-cpf').disabled = false;
        document.getElementById('area-senha').classList.add('d-none');
        document.getElementById('area-confirmar-senha').classList.add('d-none');
        document.getElementById('login-btn').innerText = 'Continuar';
        document.getElementById('login-alert').classList.add('d-none');
        
        showScreen('login');
    }

    // =====================================================
    // LOGIN MOTORISTA (FLUXO NATIVO)
    // =====================================================
    function maskCPF(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 11) v = v.substring(0, 11);
        if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{3})/, "$1.$2.$3");
        else if (v.length > 3) v = v.replace(/(\d{3})(\d{3})/, "$1.$2");
        input.value = v;
    }

    function togglePassword(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function realizarLogin(e) {
        e.preventDefault();
        document.getElementById('login-alert').classList.add('d-none');
        const cpfRaw = document.getElementById('login-cpf').value;
        const cpf = cpfRaw.replace(/\D/g, '');
        const senha = document.getElementById('login-senha').value;
        const confirmar = document.getElementById('login-confirmar-senha').value;

        if (cpf.length !== 11) {
            showMsg('login-alert', 'CPF inválido', 'danger');
            return;
        }

        setBtnLoading('login-btn', true, '');

        try {
            // PASSO 1: Verificar CPF
            if (loginModo === 'CPF') {
                const res = await fetch(`${globalServerUrl}/api/auth/verificar-cpf/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf })
                });

                if (!res.ok) throw new Error('Falha ao conectar com o servidor da transportadora.');
                
                const data = await res.json();

                if (data.status === 'NOVO_USUARIO') {
                    document.getElementById('login-cpf').disabled = true;
                    document.getElementById('area-senha').classList.remove('d-none');
                    document.getElementById('area-confirmar-senha').classList.remove('d-none');
                    loginModo = 'PRIMEIRO_ACESSO';
                    setBtnLoading('login-btn', false, 'Criar Senha e Entrar');
                } else if (data.status === 'USUARIO_EXISTENTE') {
                    document.getElementById('login-cpf').disabled = true;
                    document.getElementById('area-senha').classList.remove('d-none');
                    loginModo = 'LOGIN';
                    setBtnLoading('login-btn', false, 'Entrar');
                } else {
                    throw new Error('CPF não cadastrado na transportadora.');
                }
            }
            
            // PASSO 2: Login ou Criação de Senha
            else {
                let accessUrl = `${globalServerUrl}/api/auth/login-session/`;
                let bodyData = { username: cpf, password: senha };

                if (loginModo === 'PRIMEIRO_ACESSO') {
                    if (senha !== confirmar) throw new Error('As senhas não coincidem.');
                    accessUrl = `${globalServerUrl}/api/auth/primeiro-acesso/`;
                    bodyData = { cpf, senha, confirmar_senha: confirmar };
                }

                const res = await fetch(accessUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (!res.ok) {
                    if (res.status === 401) throw new Error('CPF ou senha inválidos.');
                    throw new Error('Erro no login. Verifique sua senha.');
                }
                
                const tokens = await res.json();
                const accessToken = tokens.access;

                // PASSO 3: Gerar e salvar Device Token NATIVO
                showMsg('login-alert', 'Autenticado! Configurando dispositivo...', 'info');
                
                const dtRes = await fetch(`${globalServerUrl}/api/auth/device-token/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ device_info: navigator.userAgent.substring(0, 200) })
                });

                if (dtRes.ok) {
                    const dtData = await dtRes.json();
                    await setPreference('device_token', dtData.device_token);
                    
                    showMsg('login-alert', 'Dispositivo vinculado! Entrando...', 'success');
                    
                    // PASSO 4: Injetar Iframe do PWA
                    setTimeout(() => {
                        loadAppIframe(`${globalServerUrl}/api/auth/auto-login/?dt=${dtData.device_token}`);
                    }, 500);
                } else {
                    throw new Error('Falha ao gerar credencial segura do dispositivo.');
                }
            }

        } catch (err) {
            showMsg('login-alert', err.message, 'danger');
            let btnText = 'Continuar';
            if (loginModo === 'LOGIN') btnText = 'Entrar';
            if (loginModo === 'PRIMEIRO_ACESSO') btnText = 'Criar Senha e Entrar';
            setBtnLoading('login-btn', false, btnText);
        }
    }

    // =====================================================
    // IFRAME & NATIVE GPS BRIDGE
    // =====================================================
    function loadAppIframe(url) {
        document.body.innerHTML = `<iframe src="${url}" allow="geolocation; camera; microphone; display-capture; accelerometer; gyroscope" style="position:fixed; top:0; left:0; width:100%; height:100%; border:none; z-index:9999;"></iframe>`;
    }

    let bgWatcherId = null;
    let currentManifesto = null;
    
    window.addEventListener('message', async (event) => {
        if (!event.data || !event.data.type) return;
        
        if (event.data.type === 'START_NATIVE_GPS') {
            const payload = event.data.payload;
            currentManifesto = payload.manifesto;
            
            if (bgWatcherId) return; // Já rodando
            
            // Trocamos o plugin antigo pelo nosso Plugin Java Nativo
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.QuickTrackPlugin) {
                const nativeTracker = window.Capacitor.Plugins.QuickTrackPlugin;
                try {
                    const deviceToken = await getPreference('device_token');
                    await nativeTracker.startTracking({
                        manifestoId: currentManifesto.toString(),
                        baseUrl: payload.baseUrl,
                        deviceToken: deviceToken || ""
                    });
                    bgWatcherId = "java_native_active";
                    console.log("MOTOR JAVA NATIVO ATIVADO", bgWatcherId);
                } catch(e) {
                    console.error('Falha crítica ao iniciar o motor Java nativo', e);
                }
            } else {
                console.error('O Plugin Java (QuickTrackPlugin) não foi injetado ou o Android Studio não reconstruiu o APK corretamente.');
            }
        }
        
        if (event.data.type === 'STOP_NATIVE_GPS') {
            if (bgWatcherId && window.Capacitor && window.Capacitor.Plugins.QuickTrackPlugin) {
                window.Capacitor.Plugins.QuickTrackPlugin.stopTracking();
                bgWatcherId = null;
                currentManifesto = null;
            }
        }
        
        if (event.data.type === 'LOGOUT_APP') {
            // Parar GPS imediatamente se estiver rodando
            if (window.Capacitor && window.Capacitor.Plugins.QuickTrackPlugin) {
                window.Capacitor.Plugins.QuickTrackPlugin.stopTracking();
            }
            // Remover todas as credenciais e vínculos do motorista
            removePreference('server_url');
            removePreference('device_token');
            removePreference('saved_cpf');
            // Recarregar a raiz do app (Tela do Código da Empresa)
            window.location.reload();
        }
    });

</script>
</body>
</html>
